name: three-tier-devops-platform
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infrastructure_portal}
      POSTGRES_USER: ${POSTGRES_USER:-portal_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-use}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.75
    pids_limit: 150
    security_opt: [no-new-privileges:true]

  migrate:
    image: ${APP_IMAGE:-three-tier-portal:local}
    command: [alembic, upgrade, head]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-portal_app}:${POSTGRES_PASSWORD:-change-me-for-local-use}@db:5432/${POSTGRES_DB:-infrastructure_portal}
    depends_on:
      db: {condition: service_healthy}
    networks: [backend]
    restart: "no"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  app:
    image: ${APP_IMAGE:-three-tier-portal:local}
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-portal_app}:${POSTGRES_PASSWORD:-change-me-for-local-use}@db:5432/${POSTGRES_DB:-infrastructure_portal}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    networks: [frontend, backend]
    expose: ["8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:size=32m]
    mem_limit: 192m
    cpus: 0.75
    pids_limit: 150
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  proxy:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:${HOST_PORT:-8080}:8080"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      app: {condition: service_healthy}
    networks: [frontend]
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 75
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]

networks:
  frontend:
    name: three-tier-frontend
  backend:
    name: three-tier-backend
    internal: true

volumes:
  postgres_data:
    name: three-tier-postgres-data
  nginx_logs:
    name: three-tier-nginx-logs
